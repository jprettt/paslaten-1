<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perbandingan Warna Card Alamat vs Sisi Belakang Wakil Pala</title>
  <link href="../css/style.css" rel="stylesheet" />
  <style>
    
      /* =====================================================
           SECTION PALA
           ===================================================== */

      .pala-section {
        position: relative;
        overflow: hidden;
      }

      .pala-section-header {
        max-width: 720px;
        margin-bottom: 2rem;
      }

      .pala-section-header h2 {
        margin-top: 0.45rem;
      }

      .pala-section-description {
        max-width: 620px;
        margin: 0.85rem 0 0;

        color: var(--color-mid-gray);

        font-family: var(--font-body);
        font-size: 0.9rem;

        line-height: 1.75;
      }

      /* =====================================================
           GRID PALA
           ===================================================== */

      .pala-contact-grid {
        display: grid;

        grid-template-columns: repeat(3, minmax(0, 1fr));

        gap: 12px;
      }

      /* =====================================================
           FLIP CARD 3D CONTAINER & STRUCTURE
           ===================================================== */

      .pala-card-wrapper {
        perspective: 1200px;
        height: 100%;
      }

      .pala-flip-card {
        position: relative;
        width: 100%;
        height: 100%;
        cursor: pointer;
        outline: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.25s ease;
      }

      .pala-flip-card:focus-visible {
        outline: 2px solid var(--color-green-dark);
        outline-offset: 4px;
        border-radius: 20px;
      }

      .pala-flip-card.is-flipped:focus-visible {
        outline-color: var(--color-gold-light);
      }

      /* Hover desktop: efek ringan (naik sedikit), jangan flip otomatis */
      @media (hover: hover) and (pointer: fine) {
        .pala-flip-card:hover {
          transform: translateY(-4px);
        }

        .pala-flip-card:hover .pala-contact-card.pala-card-front {
          border-color: rgba(45, 144, 110, 0.28);
          box-shadow: 0 15px 36px rgba(13, 31, 42, 0.07);
        }

        .pala-flip-card:hover .pala-contact-card.pala-card-back {
          border-color: rgba(255, 255, 255, 0.22);
          box-shadow: 0 16px 36px rgba(13, 31, 42, 0.25);
        }
      }

      .pala-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .pala-flip-card.is-flipped .pala-card-inner {
        transform: rotateY(180deg);
      }

      /* =====================================================
           CARD SIDES (FRONT & BACK)
           ===================================================== */

      .pala-contact-card {
        position: relative;
        min-height: 235px;
        display: flex;
        flex-direction: column;
        padding: 1.35rem;
        overflow: hidden;
        border: 1px solid rgba(26, 92, 80, 0.1);
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 8px 30px rgba(13, 31, 42, 0.035);
        transition:
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .pala-contact-card.pala-card-front,
      .pala-contact-card.pala-card-back {
        grid-row: 1 / 2;
        grid-column: 1 / 2;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .pala-contact-card.pala-card-front {
        transform: rotateY(0deg);
      }

      .pala-contact-card.pala-card-back {
        transform: rotateY(180deg);
      }

      /* =====================================================
           CARD HEADER
           ===================================================== */

      .pala-card-top {
        position: relative;

        z-index: 2;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 1rem;
      }

      .pala-card-label {
        color: var(--color-gold);

        font-family: var(--font-body);

        font-size: 0.63rem;

        font-weight: 700;

        letter-spacing: 0.12em;

        text-transform: uppercase;
      }

      .pala-card-number {
        width: 34px;
        height: 34px;

        flex-shrink: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        border: 1px solid rgba(45, 144, 110, 0.15);

        border-radius: 50%;

        color: var(--color-green-dark);

        background: rgba(45, 144, 110, 0.06);

        font-family: var(--font-heading);

        font-size: 0.68rem;

        font-weight: 700;
      }

      /* =====================================================
           LINGKUNGAN TITLE
           ===================================================== */

      .pala-contact-card h3 {
        position: relative;

        z-index: 2;

        margin: 1.35rem 0 0;

        color: var(--color-green-dark);

        font-family: var(--font-heading);

        font-size: clamp(1.25rem, 2vw, 1.55rem);

        font-weight: 650;

        letter-spacing: -0.025em;
      }

      /* =====================================================
           DETAIL PALA
           ===================================================== */

      .pala-card-details {
        position: relative;

        z-index: 2;

        display: grid;

        gap: 0.85rem;

        margin-top: 1.35rem;
      }

      .pala-detail {
        display: flex;

        align-items: flex-start;

        gap: 0.75rem;
      }

      .pala-detail-icon {
        width: 34px;
        height: 34px;

        flex-shrink: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 10px;

        color: var(--color-green-dark);

        background: rgba(45, 144, 110, 0.08);
      }

      .pala-detail-icon svg {
        width: 16px;
        height: 16px;
      }

      .pala-detail-content {
        min-width: 0;

        display: flex;
        flex-direction: column;

        gap: 0.15rem;
      }

      .pala-detail-label {
        color: var(--color-mid-gray);

        font-family: var(--font-body);

        font-size: 0.62rem;

        font-weight: 600;

        letter-spacing: 0.05em;

        text-transform: uppercase;
      }

      .pala-detail-value {
        color: var(--color-darkest);

        font-family: var(--font-body);

        font-size: 0.82rem;

        font-weight: 600;

        line-height: 1.45;
      }

      .pala-detail-value--empty {
        color: #8a9690;

        font-weight: 500;
      }

      /* =====================================================
           TELEPON & WHATSAPP LINK
           ===================================================== */

      .pala-phone-row {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .pala-phone-link {
        color: var(--color-darkest);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .pala-phone-link:hover {
        color: var(--color-green-dark);
        text-decoration: underline;
      }

      .pala-wa-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #25D366;
        color: #ffffff;
        text-decoration: none;
        flex-shrink: 0;
        transition:
          transform 0.2s ease,
          filter 0.2s ease,
          box-shadow 0.2s ease;
      }

      .pala-wa-btn:hover {
        transform: scale(1.1);
        filter: brightness(1.05);
        box-shadow: 0 2px 6px rgba(37, 211, 102, 0.35);
      }

      .pala-wa-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      /* =====================================================
           HINT FLIP
           ===================================================== */

      .pala-flip-hint {
        position: relative;
        z-index: 2;
        margin-top: auto;
        padding-top: 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-family: var(--font-body);
        font-size: 0.68rem;
        font-weight: 500;
        color: #7b8d86;
        opacity: 0.85;
        transition:
          opacity 0.2s ease,
          color 0.2s ease;
        user-select: none;
      }

      .pala-flip-card:hover .pala-flip-hint {
        opacity: 1;
        color: var(--color-green-dark);
      }

      .pala-flip-hint-icon {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
      }

      /* =====================================================
           PREFERS REDUCED MOTION (CROSSFADE)
           ===================================================== */

      @media (prefers-reduced-motion: reduce) {
        .pala-flip-card:hover {
          transform: none;
        }

        .pala-card-inner {
          transition: none;
          transform: none !important;
        }

        .pala-contact-card.pala-card-front {
          transition: opacity 0.3s ease;
          opacity: 1;
          pointer-events: auto;
        }

        .pala-contact-card.pala-card-back {
          transform: none !important;
          transition: opacity 0.3s ease;
          opacity: 0;
          pointer-events: none;
        }

        .pala-flip-card.is-flipped .pala-contact-card.pala-card-front {
          opacity: 0;
          pointer-events: none;
        }

        .pala-flip-card.is-flipped .pala-contact-card.pala-card-back {
          opacity: 1;
          pointer-events: auto;
        }
      }

      /* =====================================================
           DECORATIVE NUMBER
           ===================================================== */

      .pala-card-watermark {
        position: absolute;

        right: -0.05rem;
        bottom: -1.2rem;

        z-index: 0;

        color: rgba(45, 144, 110, 0.045);

        font-family: var(--font-heading);

        font-size: 6.5rem;

        font-weight: 700;

        line-height: 1;

        pointer-events: none;
      }

      /* =====================================================
           WARNA SISI BELAKANG (WAKIL PALA)
           MENGIKUTI GAYA WARNA CARD ALAMAT (HIJAU TUA)
           ===================================================== */

      .pala-contact-card.pala-card-back {
        color: var(--color-white);

        border: 1px solid rgba(255, 255, 255, 0.08);

        background: var(--bg-card-featured);

        box-shadow: 0 8px 30px rgba(13, 31, 42, 0.12);
      }

      .pala-contact-card.pala-card-back .pala-card-label {
        color: var(--color-gold);
      }

      .pala-contact-card.pala-card-back .pala-card-number {
        color: var(--color-gold-light);

        border: 1px solid rgba(255, 255, 255, 0.15);

        background: rgba(255, 255, 255, 0.08);
      }

      .pala-contact-card.pala-card-back h3 {
        color: var(--color-white);
      }

      .pala-contact-card.pala-card-back .pala-detail-icon {
        color: var(--color-gold-light);

        background: rgba(255, 255, 255, 0.12);
      }

      .pala-contact-card.pala-card-back .pala-detail-label {
        color: rgba(255, 255, 255, 0.72);
      }

      .pala-contact-card.pala-card-back .pala-detail-value,
      .pala-contact-card.pala-card-back .pala-phone-link {
        color: var(--color-white);
      }

      .pala-contact-card.pala-card-back .pala-phone-link:hover {
        color: var(--color-gold-light);

        text-decoration: underline;
      }

      .pala-contact-card.pala-card-back .pala-detail-value--empty {
        color: rgba(255, 255, 255, 0.6);
      }

      .pala-contact-card.pala-card-back .pala-card-watermark {
        color: rgba(255, 255, 255, 0.06);
      }

      .pala-contact-card.pala-card-back .pala-flip-hint {
        color: rgba(255, 255, 255, 0.65);
      }

      .pala-flip-card:hover .pala-contact-card.pala-card-back .pala-flip-hint {
        color: var(--color-white);

        opacity: 1;
      }

      .pala-contact-card.pala-card-back .pala-wa-btn {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.35),
          0 2px 8px rgba(0, 0, 0, 0.25);
      }

      .pala-contact-card.pala-card-back .pala-wa-btn:hover {
        box-shadow:
          0 0 0 1.5px rgba(255, 255, 255, 0.6),
          0 4px 12px rgba(37, 211, 102, 0.4);
      }

      /* =====================================================
           NOTE
           ===================================================== */

      .pala-contact-note {
        display: flex;

        align-items: flex-start;

        gap: 0.7rem;

        margin-top: 1.25rem;

        padding-top: 1rem;

        border-top: 1px solid rgba(26, 92, 80, 0.08);
      }

      .pala-contact-note svg {
        width: 17px;
        height: 17px;

        flex-shrink: 0;

        margin-top: 2px;

        color: var(--color-green);
      }

      .pala-contact-note p {
        margin: 0;

        color: var(--color-mid-gray);

        font-family: var(--font-body);

        font-size: 0.73rem;

        line-height: 1.6;
      }

      /* =====================================================
           TABLET
           ===================================================== */

      @media (max-width: 900px) {
        .pala-contact-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* =====================================================
           MOBILE
           ===================================================== */

      @media (max-width: 640px) {
        .pala-section-header {
          margin-bottom: 1.35rem;
        }

        .pala-section-description {
          font-size: 0.78rem;

          line-height: 1.65;
        }

        .pala-contact-grid {
          grid-template-columns: 1fr;

          gap: 10px;
        }

        .pala-contact-card {
          min-height: 0;

          padding: 1.15rem;

          border-radius: 17px;
        }

        .pala-card-number {
          width: 31px;
          height: 31px;

          font-size: 0.62rem;
        }

        .pala-contact-card h3 {
          margin-top: 1.05rem;

          font-size: 1.18rem;
        }

        .pala-card-details {
          margin-top: 1.05rem;

          gap: 0.7rem;
        }

        .pala-detail-icon {
          width: 31px;
          height: 31px;

          border-radius: 9px;
        }

        .pala-detail-icon svg {
          width: 15px;
          height: 15px;
        }

        .pala-detail-value {
          font-size: 0.77rem;
        }

        .pala-card-watermark {
          right: 0.35rem;

          bottom: -0.8rem;

          font-size: 5rem;
        }
      }
    
    body {
      background: #0d1f2a;
      padding: 30px 20px;
    }
    .preview-container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .preview-heading {
      color: #ffffff;
      font-family: var(--font-heading);
      margin: 30px 0 15px;
      font-size: 1.25rem;
    }
  </style>
</head>
<body class="contact-page modern-inner-page">
  <div class="preview-container">
    <h2 class="preview-heading">Referensi Card "Alamat" Asli:</h2>
    <div class="contact-modern-grid" style="margin-bottom: 40px;">
      <article class="contact-modern-card contact-modern-card--featured">
        <span class="contact-card-label"> Alamat </span>
        <h3>Jl. Kalooran</h3>
        <p>
          Kelurahan Paslaten 1<br />
          Kecamatan Tomohon Timur<br />
          Kota Tomohon, Sulawesi Utara 95446
        </p>
        <div class="contact-card-mark">01</div>
      </article>
    </div>

    <h2 class="preview-heading">Pala Setiap Lingkungan (Card 1 & 2 Dibalik ke Wakil Pala [Hijau Tua], Card 3 Tetap Sisi Depan Pala [Putih]):</h2>
    <div class="pala-contact-grid" id="pala-contact-grid"></div>
  </div>

  <script src="../js/kontak-pala.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Tunggu render
      setTimeout(() => {
        const cards = document.querySelectorAll('.pala-flip-card');
        if (cards.length >= 2) {
          cards[0].classList.add('is-flipped');
          cards[1].classList.add('is-flipped');
        }
      }, 100);
    });
  </script>
</body>
</html>
